name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # smart supports Windows 10/11 only. Node 20 reached end of life in April 2026.
        os: [windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: install.ps1 parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
      - name: install.ps1 installs smart
        if: matrix.node == 22
        shell: powershell
        env:
          SMART_DIR: ${{ runner.temp }}\smart-install
        run: |
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          smart --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
